name: gamma-ordering-v1-custody

on:
  push:
    branches:
      - freeze-gamma-ordering-v1
    paths:
      - representation_revision/gamma_ordering.py
      - run_gamma_ordering.py
      - tests/test_gamma_ordering.py
      - .github/workflows/gamma-ordering.yml

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - name: Verify full test suite before Gamma execution
        run: python -m pytest
      - name: Execute frozen Gamma ordering assay exactly once for this scientific source
        run: |
          python run_gamma_ordering.py \
            --scientific-source "$GITHUB_SHA" \
            --output gamma-ordering-result.json \
            > gamma-ordering-stdout.json
          cmp gamma-ordering-result.json gamma-ordering-stdout.json
          sha256sum gamma-ordering-result.json > gamma-ordering-result.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gamma-ordering-v1-${{ github.sha }}
          path: |
            gamma-ordering-result.json
            gamma-ordering-result.sha256
            GAMMA_PREREGISTRATION.md
            GAMMA_ORDERING_PREREGISTRATION.json
          if-no-files-found: error
