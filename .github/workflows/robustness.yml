name: resistance-robustness

on:
  push:
  pull_request:

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - run: python -m pytest
      - run: python scripts/run_resistance_robustness.py > resistance_robustness_output.json
      - run: cat resistance_robustness_output.json
