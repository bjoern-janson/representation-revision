[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "representation-revision"
version = "0.1.0"
description = "Certified finite representation-revision assays, accessibility geometry controls, and provenance-preserving research infrastructure"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["boolean_world", "certificate", "representation_revision"]

[tool.setuptools.package-data]
certificate = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
