[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "representation-revision"
version = "0.1.0"
description = "Minimal isolated L2 representation-generator revision assay"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
